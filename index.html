<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b3df5">
<meta name="description" content="Цифровой деканат будущего — концепт личного кабинета студента для конкурса MGIMO AI Challenge. Не официальный сервис вуза.">
<title>Цифровой деканат — концепт личного кабинета студента</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f4fb;--card:#fff;--ink:#17132e;--muted:#6c6886;--line:#e7e5f1;--soft:#f0eefa;--accent:#5b3df5;--accent-ink:#fff;--accent-soft:#ece8ff;--lime:#c8f169;--ok:#118a48;--ok-bg:#e4f6ea;--warn:#a8650a;--warn-bg:#fff2d9;--bad:#c62d45;--bad-bg:#fde8ec;--info:#2f5fd6;--info-bg:#e7eeff;--r:18px;--sh:0 1px 2px rgba(23,19,46,.04),0 10px 30px rgba(23,19,46,.06)}
@media (prefers-color-scheme:dark){:root{--bg:#110e20;--card:#1b1731;--ink:#f3f1fb;--muted:#a7a2c2;--line:#2c2747;--soft:#231e3d;--accent:#8a73ff;--accent-ink:#110e20;--accent-soft:#2a2350;--ok:#4fd48a;--ok-bg:#163326;--warn:#f2b552;--warn-bg:#3a2b12;--bad:#ff7d91;--bad-bg:#3d1822;--info:#86a8ff;--info-bg:#1c2647;--sh:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25)}}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3{margin:0;line-height:1.2;letter-spacing:-.01em}
h1{font-size:26px;font-weight:800}h2{font-size:18px;font-weight:800}h3{font-size:15px;font-weight:700}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}
.concept{background:var(--ink);color:var(--bg);font-size:12px;text-align:center;padding:6px 12px;padding-top:max(6px,env(safe-area-inset-top))}
.concept b{color:var(--lime)}
@media (prefers-color-scheme:dark){.concept{background:#000;color:#cfcbe6}}
/* layout */
.app{display:grid;grid-template-columns:260px 1fr;min-height:calc(100vh - 30px)}
.side{position:sticky;top:0;height:100vh;padding:22px 16px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--line);background:var(--card)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;padding:0 8px 16px}
.logo{width:36px;height:36px;border-radius:11px;background:var(--accent);display:grid;place-items:center;color:#fff;position:relative;flex:none}
.logo::after{content:"";position:absolute;right:-3px;top:-3px;width:12px;height:12px;border-radius:50%;background:var(--lime);border:2px solid var(--card)}
.brand small{display:block;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;padding:11px 12px;border:0;background:none;border-radius:12px;cursor:pointer;font-weight:600;color:var(--muted);text-align:left;position:relative}
.nav button:hover{background:var(--soft);color:var(--ink)}
.nav button[aria-current=page]{background:var(--accent-soft);color:var(--accent)}
.nav .cnt{margin-left:auto;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:800;border-radius:99px;padding:1px 7px}
.side .me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;background:var(--soft)}
.ava{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff;flex:none}
.me .n{font-weight:700;font-size:14px;line-height:1.2}.me .g{font-size:12px;color:var(--muted)}
.main{min-width:0;padding:22px 32px 48px;max-width:1180px;width:100%}
.top{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.top h1{flex:1}
.iconbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;position:relative;flex:none}
.iconbtn:hover{border-color:var(--accent)}
.dot{position:absolute;top:6px;right:6px;min-width:17px;height:17px;padding:0 4px;border-radius:99px;background:var(--bad);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;border:2px solid var(--card)}
.tabbar{display:none}
@media (max-width:880px){
 .app{grid-template-columns:1fr}
 .side{display:none}
 .main{padding:14px 14px calc(92px + env(safe-area-inset-bottom))}
 h1{font-size:22px}
 .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
 .tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted);padding:6px 0;cursor:pointer;position:relative;border-radius:12px}
 .tabbar button[aria-current=page]{color:var(--accent)}
 .tabbar .cnt{position:absolute;top:2px;left:calc(50% + 6px);background:var(--bad);color:#fff;font-size:10px;border-radius:99px;padding:0 5px;font-weight:800}
}
/* cards */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1050px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:880px){.g2{grid-template-columns:1fr}}
@media (max-width:520px){.g3{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh);min-width:0}
.card.tight{padding:14px}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.card-h h2{flex:1}
.link{border:0;background:none;color:var(--accent);font-weight:700;cursor:pointer;padding:4px 0;font-size:14px}
.hero{background:linear-gradient(135deg,var(--accent),#8b5cf6 60%,#b067ff);color:#fff;border:0;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-50px;top:-60px;width:220px;height:220px;border-radius:50%;background:var(--lime);opacity:.9}
.hero>*{position:relative;z-index:1}
.hero .muted{color:rgba(255,255,255,.82)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
@media (max-width:640px){.quick{grid-template-columns:repeat(2,1fr)}}
.quick button{border:0;border-radius:14px;background:rgba(255,255,255,.16);color:#fff;padding:12px;text-align:left;font-weight:700;cursor:pointer;display:flex;flex-direction:column;gap:8px;font-size:13px;backdrop-filter:blur(4px)}
.quick button:hover{background:rgba(255,255,255,.26)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--accent-ink);min-height:44px;transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn.sec{background:var(--card);color:var(--ink);border-color:var(--line)}
.btn.sec:hover{border-color:var(--accent)}
.btn.ghost{background:none;color:var(--accent)}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn.ok{background:var(--ok);color:#fff}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn.block{width:100%}
.row{display:flex;align-items:center;gap:10px}.wrap{flex-wrap:wrap}.between{justify-content:space-between}.grow{flex:1;min-width:0}
.stack>*+*{margin-top:10px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;border-radius:99px;padding:3px 10px;white-space:nowrap}
.b-info{background:var(--info-bg);color:var(--info)}.b-ok{background:var(--ok-bg);color:var(--ok)}.b-warn{background:var(--warn-bg);color:var(--warn)}.b-bad{background:var(--bad-bg);color:var(--bad)}.b-muted{background:var(--soft);color:var(--muted)}.b-acc{background:var(--accent-soft);color:var(--accent)}
.list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;align-items:center;padding:12px 4px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.item:first-child{border-top:0}
.item:hover .t{color:var(--accent)}
.item .t{font-weight:700}
.ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--accent-soft);color:var(--accent)}
.ico.ok{background:var(--ok-bg);color:var(--ok)}.ico.warn{background:var(--warn-bg);color:var(--warn)}.ico.bad{background:var(--bad-bg);color:var(--bad)}.ico.info{background:var(--info-bg);color:var(--info)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;min-height:38px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.empty{text-align:center;padding:30px 16px;color:var(--muted)}
.empty .big{font-size:40px;line-height:1;margin-bottom:10px}
.empty h3{color:var(--ink);margin-bottom:4px}
/* forms */
label.f{display:block;font-weight:700;font-size:13px;margin-bottom:6px}
.inp{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;min-height:46px;outline:none}
.inp:focus{border-color:var(--accent)}
textarea.inp{min-height:96px;resize:vertical}
.fld{margin-bottom:14px}
.err{color:var(--bad);font-size:13px;font-weight:600;margin-top:6px}
.hint{color:var(--muted);font-size:12px;margin-top:5px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--soft);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:9px;padding:9px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
/* skeleton */
.sk{background:linear-gradient(90deg,var(--soft),var(--line),var(--soft));background-size:200% 100%;animation:sk 1.1s infinite;border-radius:12px}
@keyframes sk{to{background-position:-200% 0}}
/* schedule */
.lesson{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.lesson:first-child{border-top:0}
.lesson .tm{font-weight:800;font-size:14px}.lesson .tm span{display:block;font-weight:600;color:var(--muted);font-size:12px}
.lesson .s{font-weight:700}
.lesson.cancel .s{text-decoration:line-through;color:var(--muted)}
.lesson.now{background:var(--accent-soft);margin:0 -12px;padding:12px;border-radius:14px;border-top-color:transparent}
.chg{display:inline-flex;gap:6px;align-items:center;margin-top:6px;font-size:12px;font-weight:700;border-radius:8px;padding:4px 8px}
.daycol h3{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.daycol.today{outline:2px solid var(--accent)}
/* progress */
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.bar .mark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.5}
.steps{display:flex;gap:6px;margin:14px 0 6px}
.steps div{flex:1;height:6px;border-radius:99px;background:var(--soft)}
.steps div.on{background:var(--accent)}
.steps-l{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-weight:600}
.kpi .v{font-size:28px;font-weight:800;letter-spacing:-.02em}
.code{font-size:36px;font-weight:800;letter-spacing:.3em;background:var(--lime);color:#17132e;border-radius:14px;padding:12px;text-align:center}
.doc{background:var(--soft);border-radius:14px;padding:16px;font-family:Georgia,"Times New Roman",serif;font-size:14px;line-height:1.55;white-space:pre-wrap}
.tl{position:relative;padding-left:22px}
.tl>div{position:relative;padding-bottom:12px}
.tl>div::before{content:"";position:absolute;left:-17px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.tl>div::after{content:"";position:absolute;left:-13px;top:17px;bottom:-3px;width:2px;background:var(--line)}
.tl>div:last-child::after{display:none}
/* chat */
.msgs{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow-y:auto;padding:4px 2px}
.msg{max-width:82%;padding:10px 13px;border-radius:16px;background:var(--soft);white-space:pre-wrap;word-wrap:break-word}
.msg.mine{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:5px}
.msg.their{border-bottom-left-radius:5px}
.msg .m{font-size:11px;opacity:.75;margin-top:4px}
.faq{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--soft)}
/* sheet */
#sheet[hidden]{display:none}
#sheet{position:fixed;inset:0;z-index:50;display:grid;place-items:center}
.sheet-bd{position:absolute;inset:0;background:rgba(10,8,25,.5);opacity:0;transition:opacity .2s}
.sheet{position:relative;background:var(--card);border-radius:22px;width:min(620px,94vw);max-height:90vh;overflow-y:auto;padding:22px;transform:translateY(12px);opacity:0;transition:.2s}
#sheet.open .sheet-bd{opacity:1}#sheet.open .sheet{transform:none;opacity:1}
.sheet-h{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
.sheet-h h2{flex:1;font-size:20px}
@media (max-width:880px){#sheet{place-items:end center}.sheet{width:100%;border-radius:22px 22px 0 0;max-height:92vh;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}.sheet::before{content:"";display:block;width:40px;height:4px;border-radius:9px;background:var(--line);margin:-6px auto 12px}}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:60;display:flex;flex-direction:column;gap:8px;width:min(440px,92vw)}
@media (max-width:880px){.toasts{bottom:calc(86px + env(safe-area-inset-bottom))}}
.toast{background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;font-weight:600;box-shadow:var(--sh);animation:tin .2s}
.toast.bad{background:var(--bad);color:#fff}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
/* login */
.login{min-height:calc(100vh - 30px);display:grid;grid-template-columns:1.1fr 1fr}
.login .l{background:linear-gradient(160deg,#2a1a8f,#5b3df5 55%,#9b5cff);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.login .l::after{content:"";position:absolute;width:340px;height:340px;border-radius:50%;background:var(--lime);right:-120px;bottom:-120px}
.login .l>*{position:relative;z-index:1}
.login .r{display:grid;place-items:center;padding:28px}
.login form{width:min(400px,100%)}
.feat{display:flex;gap:12px;align-items:flex-start;margin-top:14px;max-width:420px}
.feat .ico{background:rgba(255,255,255,.16);color:#fff}
@media (max-width:880px){.login{grid-template-columns:1fr}.login .l{padding:26px 20px 30px}.login .l .feats{display:none}.login .r{padding:22px 16px 40px;place-items:start center}}
.pw{position:relative}.pw .inp{padding-right:52px}.pw button{position:absolute;right:4px;top:4px;height:38px;width:44px;border:0;background:none;cursor:pointer;color:var(--muted);border-radius:10px}
.demo{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.demo button{border:1.5px dashed var(--line);background:none;border-radius:12px;padding:10px 6px;cursor:pointer;font-weight:700;font-size:12px;color:var(--muted)}
.demo button:hover{border-color:var(--accent);color:var(--accent)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;color:var(--muted);font-size:12px;font-weight:700;padding:8px 6px;border-bottom:1px solid var(--line)}
table.t td{padding:10px 6px;border-bottom:1px solid var(--line)}
.grade{display:inline-grid;place-items:center;min-width:34px;height:30px;border-radius:9px;font-weight:800}
.foot{margin-top:28px;font-size:12px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div class="concept" role="note"><b>Концепт для конкурса MGIMO AI Challenge</b> · не официальный сервис вуза · все данные вымышленные</div>
<div id="root"></div>
<div id="sheet" hidden></div>
<div class="toasts" aria-live="polite" id="toasts"></div>
<script>
'use strict';
/* ============ утилиты ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAY=864e5,HOUR=36e5;
const fmtD=(t,o={day:'numeric',month:'long'})=>new Date(t).toLocaleDateString('ru-RU',o);
const fmtT=t=>new Date(t).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
const fmtDT=t=>{const d=new Date(t),n=new Date();if(d.toDateString()===n.toDateString())return'сегодня, '+fmtT(t);if(new Date(n-DAY).toDateString()===d.toDateString())return'вчера, '+fmtT(t);return fmtD(t)+', '+fmtT(t)};
const plural=(n,a,b,c)=>{n=Math.abs(n)%100;const n1=n%10;if(n>10&&n<20)return c;if(n1>1&&n1<5)return b;if(n1===1)return a;return c};
const startOfDay=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
const mondayOf=t=>{const d=new Date(startOfDay(t));const w=(d.getDay()+6)%7;return d.getTime()-w*DAY};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const hex=b=>[...b].map(x=>x.toString(16).padStart(2,'0')).join('');

 async login(email,pass){await API._net();load();email=String(email).trim().toLowerCase();const at=DB.attempts[email]||{n:0,until:0};if(at.until>Date.now())throw new Error(`Слишком много попыток. Попробуйте через ${Math.ceil((at.until-Date.now())/1000)} с`);const u=DB.users.find(x=>x.email===email);const ok=u&&(await pbkdf2(pass,u.salt))===u.hash;if(!ok){at.n++;if(at.n>=5){at.until=Date.now()+60000;at.n=0}DB.attempts[email]=at;save();throw new Error('Неверная почта или пароль')}delete DB.attempts[email];const tok=rnd(24);DB.sessions[tok]={userId:u.id,exp:Date.now()+8*HOUR};save();store.set(SKEY,tok);return pub(u)},
 logout(){load();const tok=store.get(SKEY);if(tok){delete DB.sessions[tok];save()}store.del(SKEY)},
 async profile(){await API._net();return pub(API._auth())},
 async updatePhone(phone){await API._net();const u=API._auth();if(!/^\+?[0-9 ()-]{10,18}$/.test(phone))throw new Error('Проверьте номер: только цифры, пробелы, скобки и дефисы');u.phone=phone.trim();save();return pub(u)},
 async changePassword(cur,next){await API._net();const u=API._auth();if((await pbkdf2(cur,u.salt))!==u.hash)throw new Error('Текущий пароль указан неверно');if(next.length<8||!/\d/.test(next)||!/[a-zA-Zа-яА-Я]/.test(next))throw new Error('Новый пароль: от 8 символов, буквы и цифры');u.salt=rnd(16);u.hash=await pbkdf2(next,u.salt);const tok=store.get(SKEY);for(const k in DB.sessions)if(DB.sessions[k].userId===u.id&&k!==tok)delete DB.sessions[k];save()},
 async schedule(){await API._net();const u=API._auth('student');return DB.schedule[u.group]||[]},
 async grades(){await API._net();const u=API._auth('student');return DB.grades[u.id]||{current:{items:[]},session:[],past:[]}},

 async createRequest(kind,type,fields){await API._net();const u=API._auth('student');const t=typeOf(type);if(!t||(kind==='cert')!==!!CERTS.find(c=>c.id===type))throw new Error('Неизвестный тип заявки');if(kind==='st')for(const f of t.fields)if(f.req&&!String(fields[f.k]||'').trim())throw new Error(`Заполните поле «${f.l}»`);const clean={};for(const k in fields)clean[k]=String(fields[k]).slice(0,600);const r={id:String(++DB.seq),userId:u.id,kind,type,fields:clean,status:'new',createdAt:Date.now(),history:[{status:'new',at:Date.now(),by:'Вы'}]};DB.requests.push(r);save();return r},

let renderToken=0;
async function route(){
 const u=API.me();
 if(!u){renderLogin();return}
 if(!$('.app')||$('#root').dataset.uid!==u.id)shell(u);
 const[view,param]=parseHash();state.view=view;state.param=param;
 const V=(u.role==='staff'?STAFF_VIEWS:VIEWS);const fn=V[view];

 badges();
 const el=$('#view');const tok=++renderToken;
 if(!fn){el.innerHTML=`<div class="card">${emptyBox('🧭','Такой страницы нет','Возможно, ссылка устарела.',`<div style="margin-top:14px"><button class="btn" onclick="go('home')">На главную</button></div>`)}</div>`;return}

 try{const html=await fn(u,param);if(tok!==renderToken)return;el.innerHTML=html;window.scrollTo(0,0);after[view]?.(u,param);badges()}
 catch(e){if(tok!==renderToken)return;if(e instanceof AccessError&&!API.me()){renderLogin();return}
  el.innerHTML=`<div class="card">${emptyBox(e instanceof AccessError?'🔒':'⚠️',e instanceof AccessError?'Нет доступа':'Что-то пошло не так',esc(e.message),`<div style="margin-top:14px" class="row" style="justify-content:center"><button class="btn sec" onclick="route()">Повторить</button> <button class="btn" onclick="go('home')">На главную</button></div>`)}</div>`}
}
const after={};

/* ---------- данные расписания ---------- */
function lessonsFor(sched,dayTs,weekOffset){const wd=(new Date(dayTs).getDay()+6)%7+1;return sched.filter(l=>l[0]===wd).sort((a,b)=>a[1]-b[1]).map(l=>({day:l[0],pair:l[1],subj:l[2],kind:l[3],room:l[4],teacher:l[5],chg:weekOffset===0?l[6]:null}))}
function lessonHTML(l,now){const[s,e]=PAIRS[l.pair];const c=l.chg;const isNow=now&&(()=>{const d=new Date();const m=d.getHours()*60+d.getMinutes();const toM=x=>+x.slice(0,2)*60+ +x.slice(3);return m>=toM(s)&&m<=toM(e)})();
 const chg=c?`<div class="chg ${c.type==='cancel'?'b-bad':c.type==='extra'?'b-ok':'b-warn'}">${ic(c.type==='cancel'?'x':c.type==='extra'?'plus':'swap',14)} ${esc(c.text)}</div>`:'';
 return`<div class="lesson ${c&&c.type==='cancel'?'cancel':''} ${isNow&&!(c&&c.type==='cancel')?'now':''}"><div class="tm">${s}<span>${e}</span></div><div><div class="s">${esc(l.subj)} ${isNow&&!(c&&c.type==='cancel')?'<span class="badge b-acc">Идёт сейчас</span>':''}</div><div class="small muted">${esc(l.kind)} · ауд. ${esc(c&&c.room?c.room:l.room)} · ${esc(l.teacher)}</div>${chg}</div></div>`}

/* ---------- студент ---------- */
const VIEWS={
 async home(u){
  const[sch,gr,reqs,notes,th]=await Promise.all([API.schedule(),API.grades(),API.requests(),API.notes(),API.threads()]);
  const today=lessonsFor(sch,Date.now(),0);const h=new Date().getHours();const hi=h<5?'Доброй ночи':h<12?'Доброе утро':h<18?'Добрый день':'Добрый вечер';

 const draw=()=>{const t=sel&&typeOf(sel);
  openSheet(`${sheetHead(kind==='cert'?'Заказать справку':'Подать заявление')}
  ${!t?`<p class="muted small" style="margin-top:-6px">Выберите, что нужно. Данные из профиля подставим сами.</p><div class="list">${types.map(x=>`<button class="item" data-t="${x.id}"><div class="ico ${kind==='st'?'info':''}">${ic(kind==='cert'?'file':'plus')}</div><div class="grow"><div class="t">${x.t}</div><div class="small muted">${x.d}</div></div><span class="tiny muted">${x.days} ${plural(x.days,'день','дня','дней')}</span></button>`).join('')}</div>`:
  `<button class="link small" id="bk">${ic('left',14)} Другой тип</button><h3 style="margin:8px 0 14px;font-size:18px">${t.t}</h3><form id="rf" novalidate>
  ${kind==='cert'?`<div class="fld"><span class="f" style="font-weight:700;font-size:13px">Количество экземпляров</span><div class="row" style="margin-top:6px"><button type="button" class="iconbtn" id="mn" aria-label="Меньше">−</button><b id="cp" style="min-width:24px;text-align:center;font-size:18px">${fields.copies}</b><button type="button" class="iconbtn" id="pl" aria-label="Больше">+</button></div></div>
   <div class="fld"><label class="f" for="pu">Куда нужна</label><select class="inp" id="pu">${['По месту требования','В банк','Работодателю','В МФЦ / соцзащиту','В военкомат','В посольство'].map(o=>`<option ${o===fields.purpose?'selected':''}>${o}</option>`).join('')}</select></div>
   <div class="fld"><span class="f" style="font-weight:700;font-size:13px">Формат</span><div class="seg" style="margin-top:6px" id="fmt">${['Бумажная','Электронная'].map(o=>`<button type="button" aria-pressed="${fields.format===o}" data-f="${o}">${o==='Бумажная'?'Бумажная, в каб. 214':'Электронная, PDF с подписью'}</button>`).join('')}</div></div>`:
   t.fields.map(fl=>`<div class="fld"><label class="f" for="f_${fl.k}">${fl.l}${fl.req?' *':''}</label>${fl.type==='select'?`<select class="inp" id="f_${fl.k}" data-k="${fl.k}">${fl.opts.map(o=>`<option ${fields[fl.k]===o?'selected':''}>${o}</option>`).join('')}</select>`:fl.type==='subject'?`<select class="inp" id="f_${fl.k}" data-k="${fl.k}"><option value="">Выберите дисциплину</option>${(DB.grades[u.id]?.current.items||[]).map(i=>`<option ${fields[fl.k]===i[0]?'selected':''}>${esc(i[0])}</option>`).join('')}</select>`:`<textarea class="inp" id="f_${fl.k}" data-k="${fl.k}" maxlength="600">${esc(fields[fl.k]||'')}</textarea>`}</div>`).join('')+`<div class="small muted" style="margin-bottom:6px">${ic('spark',14)} Заявление собрано из данных профиля, писать от руки не нужно:</div><div class="doc" id="prev"></div>`}
  <div class="err" id="rerr" hidden role="alert"></div><button class="btn block" id="rsub" style="margin-top:16px">Отправить в деканат</button><p class="hint" style="text-align:center">Срок подготовки: ${t.days} ${plural(t.days,'рабочий день','рабочих дня','рабочих дней')}. Статус придёт в уведомления.</p></form>`}`);
  document.querySelectorAll('#sheet [data-t]').forEach(b=>b.onclick=()=>{sel=b.dataset.t;if(kind==='st')typeOf(sel).fields.forEach(fl=>{if(fl.type==='select')fields[fl.k]=fields[fl.k]||fl.opts[0]});draw()});
  if(!t)return;
  $('#bk').onclick=()=>{sel=null;draw()};
  if(kind==='cert'){$('#mn').onclick=()=>{fields.copies=Math.max(1,fields.copies-1);$('#cp').textContent=fields.copies};$('#pl').onclick=()=>{fields.copies=Math.min(5,fields.copies+1);$('#cp').textContent=fields.copies};$('#pu').onchange=e=>fields.purpose=e.target.value;document.querySelectorAll('#fmt button').forEach(b=>b.onclick=()=>{fields.format=b.dataset.f;document.querySelectorAll('#fmt button').forEach(x=>x.setAttribute('aria-pressed',x===b))})}
  else{const upd=()=>{$('#prev').textContent=statementText(t,u,fields)};document.querySelectorAll('#rf [data-k]').forEach(el=>el.oninput=el.onchange=()=>{fields[el.dataset.k]=el.value;upd()});upd()}
  $('#rf').onsubmit=async e=>{e.preventDefault();const b=$('#rsub'),er=$('#rerr');er.hidden=true;b.disabled=true;b.textContent='Отправляем…';try{const r=await API.createRequest(kind,sel,fields);closeSheet();toast(`Заявка №${r.id} отправлена. Следите за статусом здесь.`);go('request',r.id)}catch(err){er.textContent=err.message;er.hidden=false;b.disabled=false;b.textContent='Отправить в деканат'}};
 };draw()}

/* чат */
function threadView(t,u){const staff=u.role==='staff';return`<div class="card" style="max-width:820px"><div class="row between wrap" style="margin-bottom:10px"><div><h2>${esc(t.topic)}</h2><div class="small muted">${staff?esc(t.student.last+' '+t.student.first+', '+t.student.group):'Деканат · Иванова Ольга Викторовна, каб. 214'}</div></div>${t.status==='closed'?'<span class="badge b-muted">Закрыто</span>':staff?`<button class="btn sec" onclick="closeThr('${t.id}')">${ic('check',16)} Вопрос решён</button>`:'<span class="badge b-ok">Открыто</span>'}</div>
 <div class="msgs" id="msgs">${t.messages.map(m=>{const mine=(m.from==='staff')===staff;return`<div class="msg ${mine?'mine':'their'}">${esc(m.text)}<div class="m">${mine?'Вы':m.from==='staff'?'Деканат':'Студент'} · ${fmtDT(m.at)}</div></div>`}).join('')}</div>
 <form id="mf" class="row" style="margin-top:12px;align-items:flex-end"><label class="sr" for="msgin">Сообщение</label><textarea class="inp grow" id="msgin" rows="1" style="min-height:46px" placeholder="${t.status==='closed'?'Напишите, чтобы открыть обращение снова':'Сообщение…'}" maxlength="2000"></textarea><button class="btn" aria-label="Отправить" style="width:48px;padding:0">${ic('send')}</button></form></div>`}
after.thread=()=>{const m=$('#msgs');if(m)m.scrollTop=m.scrollHeight;const f=$('#mf');if(!f)return;const inp=$('#msgin');inp.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();f.requestSubmit()}};f.onsubmit=async e=>{e.preventDefault();const v=inp.value;if(!v.trim())return;inp.disabled=true;try{await API.send(state.param,v);await route()}catch(err){toast(err.message,true);inp.disabled=false}}};
async function closeThr(id){await API.closeThread(id);toast('Обращение закрыто');route()}
function newThread(){openSheet(`${sheetHead('Написать в деканат')}<form id="tf" novalidate><div class="fld"><label class="f" for="tt">Тема</label><input class="inp" id="tt" maxlength="120" placeholder="Например: перенос экзамена" autofocus></div><div class="fld"><label class="f" for="tx">Сообщение</label><textarea class="inp" id="tx" maxlength="2000" placeholder="Опишите вопрос"></textarea></div><div id="faqs" aria-live="polite"></div><div class="err" id="terr" hidden role="alert"></div><button class="btn block" id="tsub">Отправить</button><p class="hint" style="text-align:center">Ответ придёт сюда и в уведомления, обычно в течение рабочего дня</p></form>`);
 const sug=()=>{const q=($('#tt').value+' '+$('#tx').value).toLowerCase();const hits=q.trim().length<4?[]:FAQ.filter(f=>f.k.some(k=>q.includes(k))).slice(0,2);$('#faqs').innerHTML=hits.length?`<div class="faq" style="margin-bottom:14px;background:var(--accent-soft);border-color:transparent"><b style="color:var(--accent)">${ic('spark',16)} Возможно, ответ уже есть</b>${hits.map(h=>`<div style="margin-top:8px"><b class="small">${esc(h.q)}</b><div class="small">${esc(h.a)}</div></div>`).join('')}<button type="button" class="btn sec" style="margin-top:10px;min-height:36px;padding:6px 12px" data-x>Это помогло, не отправлять</button></div>`:'';$('#faqs [data-x]')?.addEventListener('click',()=>{closeSheet();toast('Отлично! Если что, мы на связи')})};
 $('#tt').oninput=sug;$('#tx').oninput=sug;
 $('#tf').onsubmit=async e=>{e.preventDefault();const b=$('#tsub'),er=$('#terr');er.hidden=true;b.disabled=true;try{const t=await API.newThread($('#tt').value,$('#tx').value);closeSheet();toast('Обращение отправлено');go('chat',t.id)}catch(err){er.textContent=err.message;er.hidden=false;b.disabled=false}}}

/* профиль */
function profileView(p){const staff=p.role==='staff';return`<div class="grid g2" style="align-items:start"><div class="card"><div class="row" style="gap:16px">${ava(p,64)}<div><h2 style="font-size:22px">${esc(p.last)} ${esc(p.first)} ${esc(p.middle)}</h2><div class="muted">${staff?esc(p.position):`Студент ${p.course} курса · ${esc(p.group)}`}</div></div></div>
 ${staff?'':`<div class="grid g2" style="gap:14px;margin-top:18px">${[['Факультет',p.faculty],['Направление',p.program],['Профиль',p.profile],['Курс',p.course+' курс'],['Группа',p.group],['Зачётная книжка','№ '+p.record]].map(([k,v])=>`<div><div class="tiny muted">${k}</div><b>${esc(v)}</b></div>`).join('')}</div>`}
 <div style="margin-top:18px"><div class="tiny muted">Почта для входа</div><b>${esc(p.email)}</b></div>
 ${staff?'':`<form id="phf" class="row" style="margin-top:16px;align-items:flex-end" novalidate><div class="grow"><label class="f" for="ph">Телефон</label><input class="inp" id="ph" value="${esc(p.phone)}" inputmode="tel" autocomplete="tel"></div><button class="btn sec">Сохранить</button></form>`}
 <button class="btn sec block" style="margin-top:18px" onclick="logout()">${ic('out',18)} Выйти</button></div>
 <div class="card"><div class="card-h"><h2>${ic('lock',18)} Безопасность</h2></div><form id="pwf" novalidate><div class="fld"><label class="f" for="p1">Текущий пароль</label><input class="inp" type="password" id="p1" autocomplete="current-password"></div><div class="fld"><label class="f" for="p2">Новый пароль</label><input class="inp" type="password" id="p2" autocomplete="new-password"><div class="hint">От 8 символов, буквы и цифры</div></div><div class="err" id="perr" hidden role="alert"></div><button class="btn">Сменить пароль</button></form>
 <div class="faq small" style="margin-top:16px">Пароль хранится только в виде хеша (PBKDF2-SHA256, 100 000 итераций, своя «соль» у каждого пользователя). Сессия длится 8 часов. После 5 неверных попыток вход блокируется на минуту. Вы видите только свои данные: чужую заявку не открыть даже по прямой ссылке.</div></div></div>`}
after.profile=()=>{const ph=$('#phf');if(ph)ph.onsubmit=async e=>{e.preventDefault();try{await API.updatePhone($('#ph').value);toast('Телефон сохранён')}catch(err){toast(err.message,true)}};
 $('#pwf').onsubmit=async e=>{e.preventDefault();const er=$('#perr');er.hidden=true;try{await API.changePassword($('#p1').value,$('#p2').value);$('#p1').value=$('#p2').value='';toast('Пароль изменён')}catch(err){er.textContent=err.message;er.hidden=false}}};

/* ---------- сотрудник деканата ---------- */
function staffActions(r){const opts={new:[['work','Взять в работу','btn'],['rejected','Отклонить','btn danger']],work:[['ready',r.kind==='cert'?'Готова к выдаче':'Одобрить','btn ok'],['rejected','Отклонить','btn danger']],ready:[['done',r.kind==='cert'?'Отметить выданной':'Исполнено','btn']]}[r.status]||[];
 if(!opts.length)return'';return`<div style="margin-top:18px;border-top:1px solid var(--line);padding-top:16px"><label class="f" for="scm">Комментарий для студента</label><textarea class="inp" id="scm" placeholder="Например: заберите в каб. 214 с 10:00 до 17:00" maxlength="500"></textarea><div class="row wrap" style="margin-top:10px">${opts.map(([s,t,c])=>`<button class="${c}" onclick="setSt('${r.id}','${s}')">${t}</button>`).join('')}</div></div>`}
async function setSt(id,s){try{await API.setStatus(id,s,$('#scm')?.value||'');toast('Статус обновлён, студент получил уведомление');route()}catch(e){toast(e.message,true)}}
const STAFF_VIEWS={
 async home(u){const[reqs,th,news]=await Promise.all([API.requests(),API.threads(),API.news()]);const c=s=>reqs.filter(r=>r.status===s).length;const wait=th.filter(t=>t.unreadStaff>0);
  return`<div class="card hero" style="margin-bottom:16px"><div class="muted small">${fmtD(Date.now(),{weekday:'long',day:'numeric',month:'long'})}</div><h1 style="margin-top:4px">Здравствуйте, ${esc(u.first)} ${esc(u.middle)}!</h1><div style="margin-top:6px;font-weight:600">${c('new')?`${c('new')} ${plural(c('new'),'новая заявка ждёт','новые заявки ждут','новых заявок ждут')} обработки`:'Новых заявок нет'}${wait.length?` · ${wait.length} ${plural(wait.length,'вопрос','вопроса','вопросов')} без ответа`:''}</div></div>
  <div class="grid g4" style="margin-bottom:16px">${[['Новые',c('new'),'info'],['В работе',c('work'),'warn'],['Готовы к выдаче',c('ready'),'ok'],['Вопросы без ответа',wait.length,'bad']].map(([t,v,k])=>`<div class="card kpi"><div class="muted small">${t}</div><div class="v" style="color:var(--${k})">${v}</div></div>`).join('')}</div>
  <div class="grid g2"><div class="card"><div class="card-h"><h2>Требуют внимания</h2><button class="link" onclick="go('requests')">Все заявки</button></div>${reqs.filter(r=>['new','work'].includes(r.status)).length?`<div class="list">${reqs.filter(r=>['new','work'].includes(r.status)).slice(0,5).map(reqItem).join('')}</div>`:emptyBox('🎉','Все заявки обработаны','Можно выпить чаю')}</div>
  <div class="card"><div class="card-h"><h2>Обращения</h2><button class="link" onclick="go('chat')">Все</button></div>${th.length?`<div class="list">${th.slice(0,5).map(threadItem).join('')}</div>`:emptyBox('💬','Обращений нет','')}</div></div>`},
 async requests(u){const reqs=await API.requests();state.sf=state.sf||'new';state.sq=state.sq||'';const f=state.sf,q=state.sq.toLowerCase();
  const list=reqs.filter(r=>(f==='all'||r.status===f||(f==='closed'&&['done','rejected','cancelled'].includes(r.status)))&&(!q||(r.id+' '+r.student.last+' '+r.student.first+' '+r.student.group+' '+typeOf(r.type).t).toLowerCase().includes(q)));
  return`<div class="card"><div class="row wrap" style="margin-bottom:10px"><div class="chips grow">${[['new','Новые'],['work','В работе'],['ready','Готовы'],['closed','Закрытые'],['all','Все']].map(([k,t])=>`<button class="chip" aria-pressed="${f===k}" onclick="state.sf='${k}';route()">${t} <span class="muted">${k==='all'?reqs.length:k==='closed'?reqs.filter(r=>['done','rejected','cancelled'].includes(r.status)).length:reqs.filter(r=>r.status===k).length}</span></button>`).join('')}</div><input class="inp" id="sq" style="max-width:260px;min-height:40px" placeholder="Поиск: ФИО, группа, №" value="${esc(state.sq)}" aria-label="Поиск по заявкам"></div>
  ${list.length?`<div class="list">${list.map(reqItem).join('')}</div>`:emptyBox('📭','Заявок нет','В этом статусе пусто')}</div>`},
 async request(u,id){const r=await API.request(id);return requestDetail(r,true)},
 async chat(u){const th=await API.threads();th.sort((a,b)=>(b.unreadStaff>0)-(a.unreadStaff>0)||b.updatedAt-a.updatedAt);return`<div class="card" style="max-width:820px"><div class="card-h"><h2>Обращения студентов</h2><span class="small muted">сначала без ответа</span></div>${th.length?`<div class="list">${th.map(threadItem).join('')}</div>`:emptyBox('💬','Обращений нет','')}</div>`},
 async thread(u,id){const t=await API.thread(id);return threadView(t,u)},
 async news(u){const news=await API.news();return`<div class="grid g2" style="align-items:start"><div class="card"><div class="card-h"><h2>Новое объявление</h2></div><form id="nf" novalidate><div class="fld"><label class="f" for="nt">Заголовок</label><input class="inp" id="nt" maxlength="120"></div><div class="fld"><label class="f" for="nx">Текст</label><textarea class="inp" id="nx" maxlength="1000"></textarea></div><div class="fld"><span class="f" style="font-weight:700;font-size:13px">Тип</span><div class="seg" id="ntag" style="margin-top:6px"><button type="button" aria-pressed="true" data-t="news">Новость</button><button type="button" aria-pressed="false" data-t="deadline">Дедлайн</button></div></div><div class="err" id="nerr" hidden role="alert"></div><button class="btn">${ic('mega',18)} Опубликовать всем студентам</button></form></div>
  <div class="card"><div class="card-h"><h2>Опубликовано</h2></div><div class="list">${news.map(n=>`<div style="padding:12px 0;border-top:1px solid var(--line)"><div class="row"><span class="badge ${n.tag==='deadline'?'b-warn':'b-acc'}">${n.tag==='deadline'?'Дедлайн':'Новость'}</span><span class="tiny muted">${fmtDT(n.at)}</span></div><h3 style="margin-top:6px">${esc(n.title)}</h3><div class="small muted">${esc(n.text)}</div></div>`).join('')}</div></div></div>`},
 async profile(u){const p=await API.profile();return profileView(p)}
};
after.requests=()=>{const s=$('#sq');if(s){s.oninput=()=>{state.sq=s.value;clearTimeout(s._t);s._t=setTimeout(async()=>{const pos=s.selectionStart;await route();const n=$('#sq');n.focus();n.setSelectionRange(pos,pos)},250)}}};
after.news=()=>{const f=$('#nf');if(!f)return;let tag='news';document.querySelectorAll('#ntag button').forEach(b=>b.onclick=()=>{tag=b.dataset.t;document.querySelectorAll('#ntag button').forEach(x=>x.setAttribute('aria-pressed',x===b))});f.onsubmit=async e=>{e.preventDefault();const er=$('#nerr');er.hidden=true;try{await API.publish($('#nt').value,$('#nx').value,tag);toast('Опубликовано, студенты получили уведомление');route()}catch(err){er.textContent=err.message;er.hidden=false}}};

window.addEventListener('storage',e=>{if(e.key===KEY){DB=null;load();route()}});
load();route();
</script>
</body>
